spring.application.name=romantic-music
server.port=${PORT:8080}

# --- SMTP (all secrets come from environment variables, never from the frontend) ---
spring.mail.host=${SMTP_HOST:smtp.gmail.com}
spring.mail.port=${SMTP_PORT:587}
spring.mail.username=${SMTP_USERNAME:}
spring.mail.password=${SMTP_PASSWORD:}
spring.mail.default-encoding=UTF-8
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.connectiontimeout=5000
spring.mail.properties.mail.smtp.timeout=5000
spring.mail.properties.mail.smtp.writetimeout=5000

# --- Notification settings ---
# Where the "Me gussa hoo" alert is delivered (your inbox).
app.mail.to=${NOTIFY_TO:}
# Sender address; defaults to the SMTP username.
app.mail.from=${NOTIFY_FROM:${SMTP_USERNAME:}}
app.timezone=${APP_TIMEZONE:Asia/Kolkata}

# --- CORS (comma separated list of allowed frontend origins) ---
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# --- Rate limiting for the email endpoint ---
# One email per client per cooldown window, plus a global hourly ceiling.
app.rate-limit.cooldown-seconds=${COOLDOWN_SECONDS:60}
app.rate-limit.max-per-hour=${MAX_EMAILS_PER_HOUR:20}

# Honour X-Forwarded-For when deployed behind a reverse proxy (Render, Nginx, ...)
server.forward-headers-strategy=${FORWARD_HEADERS_STRATEGY:none}

logging.level.com.romantic.music=INFO
